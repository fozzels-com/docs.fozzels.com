# Sveltia CMS — WYSIWYG editor for non-technical writers (QA).
# Edits are committed as Markdown to the GitHub repo; Cloudflare Pages rebuilds automatically.

backend:
  name: github
  repo: fozzels-com/docs.fozzels.com
  branch: main
  # OAuth handler (Cloudflare Worker running sveltia-cms-auth). Set after deploying it.
  base_url: https://REPLACE-WITH-AUTH-WORKER.workers.dev

# Editors only edit the English source; the AI translation script generates the other locales.
locale: en

# Uploaded images are stored next to the document (co-located screenshots).
media_folder: static/img/uploads
public_folder: /img/uploads

collections:
  - name: docs
    label: Documentation
    label_singular: Article
    description: Help Center articles. Organized into folders shown in the sidebar.
    folder: docs
    create: true
    extension: md
    format: frontmatter
    nested:
      depth: 4
    path: '{{slug}}'
    # Store images uploaded within an article next to that article.
    media_folder: ''
    public_folder: ''
    fields:
      - {label: Title, name: title, widget: string}
      - {label: Sidebar position, name: sidebar_position, widget: number, required: false}
      - {label: Description, name: description, widget: text, required: false}
      - {label: Body, name: body, widget: markdown}
      # Preserved, not edited by writers (changing these would alter URLs/identity).
      - {label: Slug, name: slug, widget: hidden, required: false}
      - {label: ID, name: id, widget: hidden, required: false}
